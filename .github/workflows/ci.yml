name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or pull request stops the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each uv command uses the Python version in .python-version (3.14).
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check that uv.lock agrees with pyproject.toml
        run: uv lock --check
      - name: Lint
        run: uv run --locked ruff check --output-format=github
      - name: Check the format
        run: uv run --locked ruff format --check --diff

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Test
        run: uv run --locked pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # uvx builds the package from the repository, so a build error stops each installation.
      - name: Build the wheel and the source distribution
        run: uv build
      - name: Import the installed package
        run: uv run --isolated --no-project --with dist/*.whl python -c "import ui_network_mcp.server"

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check that the plugin version is the package version
        run: |
          package="$(uv version --short)"
          plugin="$(jq -r .version .claude-plugin/plugin.json)"
          if [[ "$package" != "$plugin" ]]; then
            echo "::error file=.claude-plugin/plugin.json::The plugin version $plugin is not the package version $package in pyproject.toml."
            exit 1
          fi
      # Increase this version to get the newest plugin checks.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.322
      - name: Validate the plugin and the marketplace
        run: claude plugin validate .
